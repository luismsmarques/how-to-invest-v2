name: CI

# Repeatable test suite: lint all our PHP and run the engine matrix + unit
# tests on every push and PR. Keeps the deterministic core (scoring,
# archetypes, allocation, safety traps, fallback) green.

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Lint + test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Every plugin we wrote, not a hand-maintained subset: hti-social was
      # missing here, which is how a syntax error in it could have reached a
      # deploy with CI green.
      - name: PHP lint (plugins + theme, excluding vendor)
        run: |
          find wp-content/plugins wp-content/themes/howtoinvest \
            -path '*/vendor/*' -prune -o -path '*/node_modules/*' -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: JS syntax check
        run: |
          find wp-content/plugins wp-content/themes/howtoinvest \
            -path '*/node_modules/*' -prune -o -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Run the test suite
        run: php wp-content/plugins/hti-engine/tests/run.php

      - name: Run the hti-rss-ai test suite
        run: php wp-content/plugins/hti-rss-ai/tests/run.php

      - name: Run the hti-forex test suite
        run: php wp-content/plugins/hti-forex/tests/run.php

      # The two .mjs suites already run inside the PHP runners above (they
      # shell out to node when it exists, which is why Node is set up). This
      # step exists so a missing node is a failure here rather than a silent
      # "skipping" line nobody reads.
      - name: Prove the Node suites actually ran
        run: |
          node wp-content/plugins/hti-engine/tests/test-tools-core.mjs
          node wp-content/plugins/hti-forex/tests/test-forex-core.mjs

      # A lockfile is what makes the deployed dependency knowable. Without it
      # `composer audit` has nothing to audit and the deploy installs whatever
      # the range resolved to that day.
      - name: Composer dependency audit (Dompdf)
        working-directory: wp-content/plugins/hti-engine
        run: |
          test -f composer.lock || { echo "composer.lock is missing — the Dompdf version is not pinned."; exit 1; }
          composer validate --no-check-publish --no-check-all
          composer audit --locked --no-interaction
